services:
  - type: web
    name: crystagraph-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python3 scripts/build_database.py && python3 scripts/process_papers.py && python3 models/train_property_predictor.py
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CRYSTAGRAPH_JWT_SECRET
        generateValue: true
    healthCheckPath: /api/v1/health

