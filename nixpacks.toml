# Nixpacks configuration for Railway deployment
# Overrides Nixpacks default auto-detection to run FastAPI REST API instead of Streamlit

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python3 scripts/build_database.py",
  "python3 scripts/process_papers.py",
  "python3 models/train_property_predictor.py"
]

[start]
cmd = "sh -c 'python3 -m uvicorn app.api:app --host 0.0.0.0 --port ${PORT:-8000}'"

